name: dolpin
description: "K-pop concert item C2C rental marketplace"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Supabase
  supabase_flutter: ^2.8.0

  # Routing
  go_router: ^14.8.1

  # Image
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # UI
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  intl: ^0.20.2

  # Payment
  iamport_flutter: ^0.10.20
  http: ^1.2.2

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Crash Reporting
  sentry_flutter: ^8.12.0

  # Utility
  # `characters` is transitively available via flutter, but the
  # `depend_on_referenced_packages` lint requires it to be declared
  # explicitly whenever we import `package:characters/characters.dart`
  # (see Validators.sanitizeSearch which uses grapheme-safe .take()).
  characters: ^1.3.0
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  shared_preferences: ^2.3.4
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  envied: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  envied_generator: ^1.1.0
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

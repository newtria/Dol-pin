name: dolpin
description: "K-pop concert item C2C rental marketplace"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Supabase
  supabase_flutter: ^2.8.0

  # Routing
  go_router: ^14.8.1

  # Image
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # UI
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  intl: ^0.20.2

  # Payment — `iamport_flutter` was deprecated by PortOne. `portone_flutter`
  # is the maintained successor; the V1 `IamportPayment` widget is unchanged
  # (same class name, new import path: `package:portone_flutter/v1/...`).
  #
  # Pinned to 0.12.x because 1.0.x bumps `json_annotation` to ^4.11, which
  # conflicts with `custom_lint 0.7.5 ↔ analyzer ^7.0.0` (custom_lint has
  # not caught up to analyzer 10 as of 2026-05). When custom_lint releases
  # a version on analyzer 10+, bump this pin to ^1.0 in the same PR.
  portone_flutter: ^0.12.1
  http: ^1.2.2

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Crash Reporting. v9 requires Flutter 3.24+ / Dart 3.5+ — already met by
  # this repo. `enableTracing` was removed in v9; we never used it.
  sentry_flutter: ^9.20.0

  # Utility
  # `characters` is transitively available via flutter, but the
  # `depend_on_referenced_packages` lint requires it to be declared
  # explicitly whenever we import `package:characters/characters.dart`
  # (see Validators.sanitizeSearch which uses grapheme-safe .take()).
  characters: ^1.3.0
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  # share_plus 13 deprecated `Share.share()` in favour of
  # `SharePlus.instance.share(ShareParams(...))`. Call sites updated in
  # `lib/core/utils/share_helper.dart`.
  share_plus: ^13.1.0
  shared_preferences: ^2.3.4
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  envied: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  envied_generator: ^1.1.0
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

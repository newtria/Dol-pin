include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    invalid_annotation_target: ignore
    # Async-hygiene rules — promoted to `warning` once the incremental
    # cleanup of session 1 landed. `flutter analyze` will now flag PR-time
    # regressions instead of silently accepting them.
    unawaited_futures: warning
    unnecessary_await_in_return: warning
    avoid_slow_async_io: warning
    # Immutability lints stay at `info` for one more sweep — there is
    # still a long tail of non-final locals in feature screens that
    # `dart fix --apply` will resolve. Promote to `warning` once that
    # cleanup PR lands.
    prefer_final_locals: info
    prefer_final_in_for_each: info

linter:
  rules:
    # Async hygiene. Fire-and-forget Futures are a common bug source in
    # Supabase-heavy code (`.from(...).update(...)` returns a Future that
    # the caller must not drop).
    unawaited_futures: true
    unnecessary_await_in_return: true
    avoid_slow_async_io: true

    # Immutability / style. Catches subtle "final was intended" cases that
    # `dart fix` can auto-apply later.
    prefer_final_locals: true
    prefer_final_in_for_each: true

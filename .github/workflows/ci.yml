name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Flutter SDK pinned to match mise.toml / local dev. Bumping this should
# happen together with `mise use asdf:mise-plugins/mise-flutter@<version>`
# so local and CI stay aligned.
env:
  FLUTTER_VERSION: '3.41.4'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-

      - name: Install dependencies
        # Dependabot regenerates pubspec.lock with its own (newer) Dart SDK, so
        # --enforce-lockfile cannot be reproduced under the pinned FLUTTER_VERSION
        # and fails with exit 65. Skip enforcement for dependabot PRs; analyze and
        # test still validate that the bumped dependencies work under our SDK.
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            flutter pub get
          else
            flutter pub get --enforce-lockfile
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

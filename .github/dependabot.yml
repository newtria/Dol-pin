version: 2
updates:
  # Active npm workspaces only; the Flutter archive is not maintained.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "npm"
    ignore:
      # Major upgrades require a coordinated review.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Expo pins compatible native/React versions, including 0.x RN minors.
      - dependency-name: "react-native*"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "expo*"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "@expo/*"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "react"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-minor"
    groups:
      npm-patch-minor:
        update-types:
          - "patch"
          - "minor"

  # GitHub Actions workflow files
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      gha-all:
        patterns:
          - "*"

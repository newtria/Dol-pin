version: 2
updates:
  # Dart / Flutter packages (pub)
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "pub"
    # Group patch / minor bumps so they land as a single PR per week
    # instead of a flood that nobody triages. Majors land in their own
    # group so they're triaged together but kept separate from minors.
    groups:
      pub-production-patches:
        dependency-type: "production"
        update-types:
          - "patch"
      pub-production-minors:
        dependency-type: "production"
        update-types:
          - "minor"
      pub-dev-dependencies:
        dependency-type: "development"
        update-types:
          - "patch"
          - "minor"
      pub-majors:
        update-types:
          - "major"
      riverpod:
        patterns:
          - "flutter_riverpod"
          - "riverpod*"
      freezed:
        patterns:
          - "freezed*"
      supabase:
        patterns:
          - "supabase*"

  # GitHub Actions workflow files
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      gha-all:
        patterns:
          - "*"
